name: Autonomous AI Agent Keep-Alive

on:
  schedule:
    # Запуск каждые 35 минут (Hugging Face не успеет уснуть)
    - cron: '*/35 * * * *'
  workflow_dispatch: # Кнопка для ручного запуска в любое время

jobs:
  ping-spaces:
    runs-on: ubuntu-latest
    steps:
      - name: Ping All 4 Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "=========================================="
          echo "⏰ ЗАПУСК БУДИЛЬНИКА ДЛЯ ВСЕХ 4 СПЕЙСОВ"
          echo "=========================================="

          # 1. Cupid Agent (Приватный спейс — пинг через API и прямой URL)
          echo "1. Пинг cupid-agent..."
          curl -s -o /dev/null -w "• cupid-agent (API): %{http_code}\n" \
            -H "Authorization: Bearer $HF_TOKEN" \
            https://huggingface.co/api/spaces/opion2008/cupid-agent || true

          curl -s -o /dev/null -w "• cupid-agent (Direct): %{http_code}\n" \
            -H "Authorization: Bearer $HF_TOKEN" \
            https://opion2008-cupid-agent.hf.space/ || true

          # 2. Cupidon (Основной бот знакомств)
          echo "2. Пинг cupidon..."
          curl -s -o /dev/null -w "• cupidon (/ping): %{http_code}\n" \
            -H "Authorization: Bearer $HF_TOKEN" \
            https://opion2008-cupidon.hf.space/ping || true

          # 3. Rslaw Bot (Автоюрист)
          echo "3. Пинг rslaw-bot..."
          curl -s -o /dev/null -w "• rslaw-bot: %{http_code}\n" \
            -H "Authorization: Bearer $HF_TOKEN" \
            https://opion2008-rslaw-bot.hf.space/ || true

          # 4. Criminal Bot (Уголовное право)
          echo "4. Пинг criminal-bot..."
          curl -s -o /dev/null -w "• criminal-bot: %{http_code}\n" \
            -H "Authorization: Bearer $HF_TOKEN" \
            https://opion2008-criminal-bot.hf.space/ || true

          echo "=========================================="
          echo "✅ Все 4 спейса успешно получили импульс бодрствования!"
          echo "=========================================="
