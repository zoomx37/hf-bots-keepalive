name: Auto Restart HuggingFace Bots

on:
  schedule:
    - cron: '0 0,12 * * *' # Каждые 12 часов
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  restart-spaces:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugging Face Hub
        run: pip install huggingface_hub

      - name: Restart Spaces via API
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os
          api = HfApi(token=os.environ['HF_TOKEN'])
          
          spaces = ['opion2008/criminal-bot', 'opion2008/rslaw-bot']
          
          for space in spaces:
              try:
                  api.restart_space(repo_id=space)
                  print(f'Successfully restarted {space}')
              except Exception as e:
                  print(f'Error restarting {space}: {e}')
          "
