name: Autonomous AI Agent

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests huggingface_hub openai telethon vk_api pyyaml

      - name: Run Autonomous Agent
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BACKUP_KEYS: ${{ secrets.GEMINI_BACKUP_KEYS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
          FB_API_KEY: ${{ secrets.FB_API_KEY }}
          FB_SECRET_KEY: ${{ secrets.FB_SECRET_KEY }}
          MODEL_GEMINI: "gemini-3.8-flash"
          MODEL_OPENROUTER: "z-ai/glm-5.2:free"
          VK_ENABLED: "true"
        run: python agent.py
